<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TheGoldClothes</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #fff;
  overflow-x: hidden;
}

/* NAVBAR PRO */
nav {
  position: fixed;
  width: 100%;
  top: 0;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.7);
  padding: 15px;
  text-align: center;
  font-weight: bold;
  letter-spacing: 3px;
  z-index: 1000;
}

/* BANNER */
.banner img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  margin-top: 50px;
}

/* PRODUCTO */
.producto {
  text-align: center;
  margin: 50px 20px;
  animation: fade 1s ease;
}

.producto img {
  width: 260px;
  transition: 0.4s;
  cursor: pointer;
}

.producto img:hover {
  transform: scale(1.05);
}

@keyframes fade {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

/* DETALLE */
.detalle {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  overflow-y: auto;
  z-index: 2000;
  padding: 20px;
}

.galeria img {
  width: 100%;
  max-width: 400px;
  margin-bottom: 10px;
  transition: 0.3s;
}

.galeria img:hover {
  transform: scale(1.03);
}

/* BOTONES */
button {
  background: linear-gradient(135deg, gold, #d4af37);
  border: none;
  padding: 14px;
  margin-top: 10px;
  cursor: pointer;
  width: 100%;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  opacity: 0.8;
}

/* CARRITO PRO */
#carrito {
  position: fixed;
  right: -350px;
  top: 0;
  width: 320px;
  height: 100%;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(15px);
  border-left: 1px solid #eee;
  padding: 20px;
  transition: 0.4s;
  z-index: 3000;
}

#carrito.active {
  right: 0;
}

#cerrarCarrito {
  cursor: pointer;
  font-size: 20px;
  float: right;
}

.item {
  margin: 15px 0;
  font-size: 14px;
}

/* CHECKOUT */
#checkout {
  display: none;
  position: fixed;
  bottom: 0;
  width: 100%;
  background: white;
  padding: 20px;
  border-top: 1px solid #ddd;
  z-index: 4000;
  animation: fade 0.5s ease;
}

/* WHATSAPP */
#wsp {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #25D366;
  color: white;
  font-size: 22px;
  padding: 14px;
  border-radius: 50%;
  text-decoration: none;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* MOBILE */
@media(max-width:600px){
  .producto img {
    width: 80%;
  }

  #carrito {
    width: 100%;
  }
}
</style>

</head>
<body>

<nav>THE GOLD CLOTHES</nav>

<div class="banner">
  <img src="banner.jpg">
</div>

<div class="producto">
  <img src="img1.jpg" onclick="verProducto()">
  <h2>Polerón Nike Tech Fleece Gris</h2>
  <p>$80.000</p>
</div>

<!-- DETALLE -->
<div class="detalle" id="detalle">
  <h2>Polerón Nike Tech Fleece Gris</h2>

  <div class="galeria">
    <img src="img1.jpg">
    <img src="img2.jpg">
    <img src="img3.jpg">
  </div>

  <p><b>Talla:</b> S</p>
  <p>Material premium Nike Tech Fleece</p>

  <button onclick="agregar()">Agregar al carrito</button>
  <button onclick="cerrarDetalle()">Cerrar</button>
</div>

<!-- CARRITO -->
<div id="carrito">
  <span id="cerrarCarrito" onclick="toggleCarrito()">✖</span>
  <h2>Tu carrito</h2>
  <div id="items"></div>
  <button onclick="mostrarCheckout()">Finalizar compra</button>
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <input type="email" id="email" placeholder="Tu correo" style="width:100%;padding:12px;margin-bottom:10px;">
  <button onclick="comprar()">Enviar pedido por WhatsApp</button>
  <button onclick="cancelar()">Cancelar</button>
</div>

<!-- BOTON WHATSAPP -->
<a href="https://wa.me/56978858164" target="_blank" id="wsp">💬</a>

<script>
let cantidad = 0;
let precio = 80000;

/* PRODUCTO */
function verProducto(){
  document.getElementById("detalle").style.display="block";
}

function cerrarDetalle(){
  document.getElementById("detalle").style.display="none";
}

/* CARRITO */
function agregar(){
  cantidad++;
  actualizarCarrito();
  abrirCarritoAuto();
}

function actualizarCarrito(){
  let cont = document.getElementById("items");

  if(cantidad > 0){
    cont.innerHTML = `
    <div class="item">
      Polerón Nike Tech Fleece Gris<br>
      Cantidad: ${cantidad}<br>
      Total: $${cantidad * precio}
      <br><button onclick="quitar()">Quitar</button>
    </div>`;
  } else {
    cont.innerHTML = "Carrito vacío";
  }
}

function quitar(){
  cantidad--;
  if(cantidad < 0) cantidad = 0;
  actualizarCarrito();
}

/* CARRITO CONTROL */
function toggleCarrito(){
  document.getElementById("carrito").classList.toggle("active");
}

function abrirCarritoAuto(){
  let c = document.getElementById("carrito");
  c.classList.add("active");

  setTimeout(()=>{
    c.classList.remove("active");
  }, 4000);
}

/* CHECKOUT */
function mostrarCheckout(){
  document.getElementById("checkout").style.display="block";
  document.getElementById("carrito").classList.remove("active");
}

function cancelar(){
  document.getElementById("checkout").style.display="none";
}

/* COMPRA */
function comprar(){
  let email = document.getElementById("email").value;

  let mensaje = `Hola, quiero comprar:

🛍 Producto: Polerón Nike Tech Fleece Gris
📏 Talla: S
🔢 Cantidad: ${cantidad}

💰 Total: $${cantidad * precio}

📧 Correo: ${email}`;

  window.open(`https://wa.me/56978858164?text=${encodeURIComponent(mensaje)}`);
}
</script>

</body>
</html>
