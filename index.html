<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gold Clothes</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

/* NAVBAR */
nav{
    position:fixed;
    top:0;
    width:100%;
    background:white;
    text-align:center;
    padding:15px;
    font-weight:bold;
    letter-spacing:2px;
    z-index:1000;
}

/* BANNER */
.banner{
    margin-top:60px;
}
.banner img{
    width:100%;
    height:300px;
    object-fit:cover;
}

/* PRODUCTO */
.producto{
    text-align:center;
    padding:40px 20px;
}
.producto img{
    width:280px;
}
.btn{
    background:gold;
    border:none;
    padding:15px;
    width:80%;
    margin-top:10px;
    cursor:pointer;
    font-weight:bold;
}

/* BOTON CARRITO */
.cart-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:black;
    color:white;
    border-radius:50%;
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
    z-index:2000;
}

/* CARRITO */
.cart{
    position:fixed;
    top:0;
    right:-100%;
    width:350px;
    height:100%;
    background:white;
    box-shadow:-5px 0 20px rgba(0,0,0,0.2);
    padding:20px;
    transition:0.4s;
    z-index:3000;
}
.cart.active{
    right:0;
}

.cart h2{
    margin-top:0;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    cursor:pointer;
    font-size:22px;
}

/* BOTONES CARRITO */
.cart button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    background:gold;
    font-weight:bold;
    cursor:pointer;
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    display:none;
    z-index:2500;
}
.overlay.active{
    display:block;
}

/* RESPONSIVE */
@media(max-width:600px){
    .cart{
        width:100%;
    }
}
</style>
</head>

<body>

<nav>THE GOLD CLOTHES</nav>

<div class="banner">
    <img src="banner.jpg">
</div>

<div class="producto">
    <img src="img1.jpg">
    <h2 id="nombre">Polerón Nike Tech Fleece Gris</h2>
    <p>$80.000</p>
    <button class="btn" onclick="agregar()">Agregar al carrito</button>
</div>

<!-- BOTON FLOTANTE -->
<div class="cart-btn" onclick="abrirCarrito()">🛒</div>

<!-- OVERLAY -->
<div class="overlay" id="overlay" onclick="cerrarCarrito()"></div>

<!-- CARRITO -->
<div class="cart" id="cart">
    <span class="close" onclick="cerrarCarrito()">✖</span>
    <h2>Tu carrito</h2>

    <p id="productoCarrito"></p>
    <p id="cantidad"></p>
    <p id="total"></p>

    <button onclick="quitar()">Quitar producto</button>
    <button onclick="comprar()">Finalizar compra</button>
</div>

<script>
let cantidad = 0;
const precio = 80000;

function agregar(){
    cantidad++;
    actualizar();
    abrirCarrito();
}

function quitar(){
    if(cantidad > 0){
        cantidad--;
        actualizar();
    }
}

function actualizar(){
    if(cantidad === 0){
        document.getElementById("productoCarrito").innerText = "Carrito vacío";
        document.getElementById("cantidad").innerText = "";
        document.getElementById("total").innerText = "";
    } else {
        document.getElementById("productoCarrito").innerText =
        document.getElementById("nombre").innerText;

        document.getElementById("cantidad").innerText = "Cantidad: " + cantidad;
        document.getElementById("total").innerText = "Total: $" + (precio * cantidad);
    }
}

function abrirCarrito(){
    document.getElementById("cart").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function cerrarCarrito(){
    document.getElementById("cart").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function comprar(){
    if(cantidad === 0){
        alert("El carrito está vacío");
        return;
    }

    let mensaje = `Hola, quiero comprar:
${document.getElementById("nombre").innerText}
Cantidad: ${cantidad}
Total: $${precio * cantidad}`;

    let numero = "56978858164"; // CAMBIA ESTO
    let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);

    window.open(url, "_blank");
}
</script>

</body>
</html>
